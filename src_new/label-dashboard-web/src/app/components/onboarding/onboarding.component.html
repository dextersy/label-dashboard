<div class="onboarding-overlay" *ngIf="showOnboarding && currentStep">
  <!-- Dark backdrop -->
  <div class="onboarding-backdrop"></div>

  <!-- Highlight around target element (only shown once a valid position has been measured) -->
  <div class="onboarding-highlight" *ngIf="currentStep.targetElement && highlightReady" [ngStyle]="highlightStyle" [class.transitioning]="isTransitioning"></div>

  <!-- Tooltip with step content (only transition opacity when highlight is also ready, to avoid a tooltipless dark screen) -->
  <div class="onboarding-tooltip" [ngStyle]="tooltipStyle" [class.transitioning]="isTransitioning && highlightReady">
    <div class="tooltip-header">
      <div class="tooltip-header-text">
        <span class="wizard-label" *ngIf="currentWizard">{{ currentWizard.name }} tour</span>
        <h3>{{ currentStep.title }}</h3>
      </div>
      <button class="close-btn" (click)="onClose()" aria-label="Close onboarding">
        <app-icon name="x" iconOnly />
      </button>
    </div>

    <div class="tooltip-body">
      <p>{{ currentStep.description }}</p>
    </div>

    <div class="tooltip-footer">
      <div class="button-row">
        <button
          *ngIf="canGoPrevious; else backSpacer"
          class="btn-secondary"
          (click)="onPrevious()">
          <app-icon name="arrow-left" /> Back
        </button>
        <ng-template #backSpacer><span class="btn-spacer"></span></ng-template>

        <span class="step-number">{{ wizardStepIndex + 1 }} of {{ wizardTotalSteps }}</span>

        <button
          class="btn-primary"
          (click)="onNext()">
          {{ isLastStep ? 'Get Started' : 'Next' }}
          <app-icon name="arrow-right" iconOnly *ngIf="!isLastStep" />
          <app-icon name="check" iconOnly *ngIf="isLastStep" />
        </button>
      </div>

      <div class="skip-row">
        <button class="skip-link" (click)="onSkipWizard()">{{ skipWizardLabel }}</button>
      </div>
    </div>
  </div>
</div>
