<div class="events-page">
  <app-breadcrumb></app-breadcrumb>
  <div class="container-fluid">

    <!-- Page Header with Event Selector -->
    <div class="page-header tw-mb-3">
      <div class="tw-flex tw-items-start tw-flex-wrap tw-gap-3">
        <div class="event-selector-main">
          <app-event-selection
            [events]="availableEvents"
            [selectedEvent]="selectedEvent"
            [loading]="loading"
            [isAdmin]="isAdmin"
            (eventSelected)="onEventSelection($event)">
          </app-event-selection>
        </div>
        <span *ngIf="selectedEvent && selectedEvent.user_role && selectedEvent.user_role !== 'owner'"
              class="tw-text-xs tw-text-gray-400 tw-self-center">
          <app-icon name="users" class="tw-mr-1" />
          Collaborator ({{ selectedEvent.user_role | titlecase }}) &middot; <a href="javascript:void(0)" class="tw-text-gray-400 hover:tw-text-danger tw-underline" (click)="leaveCollaboration()">Leave</a>
        </span>
      </div>
    </div>

    <!-- Past Event Warning -->
    <div class="tw-px-4 tw-py-3 tw-mb-4 tw-border tw-rounded-lg tw-text-sm tw-leading-normal tw-border-amber-200 tw-bg-amber-50 tw-text-amber-800 tw-mb-3" *ngIf="selectedEvent && isEventPast(selectedEvent)">
      <app-icon name="warning" class="tw-mr-2" />
      <strong>This event occurred in the past.</strong> Changes you can make are limited.
    </div>

    <!-- Main Content -->
    <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-12 tw-gap-6" *ngIf="selectedEvent">
      <div class="tw-col-span-12">

        <!-- Sales section: InPageNav with sub-tabs -->
        <ng-container *ngIf="activeSection === 'sales'">
          <app-in-page-nav [tabs]="salesNavTabs" [activeTab]="activeTab" (tabChange)="setActiveTab($any($event))">

            <div *ngIf="activeTab === 'tickets'">
              <app-event-tickets-tab
                [selectedEvent]="selectedEvent"
                [isAdmin]="isManager"
                (alertMessage)="onAlertMessage($event)">
              </app-event-tickets-tab>
            </div>

            <div *ngIf="activeTab === 'walk-ins'">
              <app-event-walk-ins-tab
                [selectedEvent]="selectedEvent"
                [isAdmin]="isManager"
                (alertMessage)="onAlertMessage($event)">
              </app-event-walk-ins-tab>
            </div>

            <div *ngIf="activeTab === 'abandoned'">
              <app-event-abandoned-orders-tab
                [selectedEvent]="selectedEvent"
                [isAdmin]="isManager"
                (alertMessage)="onAlertMessage($event)">
              </app-event-abandoned-orders-tab>
            </div>

            <div *ngIf="activeTab === 'referrals'">
              <app-event-referrals-tab
                [selectedEvent]="selectedEvent"
                [isAdmin]="isManager"
                (alertMessage)="onAlertMessage($event)">
              </app-event-referrals-tab>
            </div>

          </app-in-page-nav>
        </ng-container>

        <!-- Email Attendees section -->
        <div *ngIf="activeSection === 'email'">
          <app-event-email-tab
            [selectedEvent]="selectedEvent"
            [isAdmin]="isManager"
            (alertMessage)="onAlertMessage($event)">
          </app-event-email-tab>
        </div>

        <!-- Event Settings section: event-form handles its own nav (Details, Ticketing, Walk-in, Listing, Collaborators, Scanner) -->
        <div *ngIf="activeSection === 'settings'">
          <app-event-form></app-event-form>
        </div>

        <!-- Order Add-ons section -->
        <div *ngIf="activeSection === 'add-ons'">
          <app-event-add-ons></app-event-add-ons>
        </div>

      </div>
    </div>

    <!-- Loading Events -->
    <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-12 tw-gap-6" *ngIf="loading && availableEvents.length === 0">
      <div class="tw-col-span-12">
        <div class="sm:tw-bg-white sm:tw-rounded-card sm:tw-shadow-card sm:tw-overflow-hidden tw-mb-8">
          <div class="tw-px-card-pad tw-pb-card-pad tw-p-5 tw-text-center">
            <div class="loading-dots">
              <div></div>
              <div></div>
              <div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- No Events Available -->
    <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-12 tw-gap-6" *ngIf="!loading && availableEvents.length === 0">
      <div class="tw-col-span-12">
        <div class="sm:tw-bg-white sm:tw-rounded-card sm:tw-shadow-card sm:tw-overflow-hidden tw-mb-8">
          <div class="tw-px-card-pad tw-pb-card-pad tw-p-5 tw-text-center">
            <app-icon name="ticket" class="fa-4x tw-mb-3 tw-text-muted" iconOnly />
            <h4>No Events Available</h4>
            <p class="tw-text-muted">No events found for your label. Create a new event to get started.</p>
            <button class="btn-primary" *ngIf="isAdmin" (click)="openCreateEventModal()">
              <app-icon name="plus" class="tw-mr-1" />Create New Event
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
