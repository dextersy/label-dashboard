<div class="modal fade show" style="display: block;" *ngIf="show" (click)="onBackdropClick($event)">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">
          <div class="pm-header-type">Payouts</div>
          <div class="pm-header-brand">{{ brandName }}</div>
        </div>
        <button type="button" class="btn-close" (click)="onClose()"></button>
      </div>
      <div class="modal-body tw-px-4 tw-pt-3 tw-pb-2">

        <div class="pm-summary" *ngIf="pagination">
          <div class="pm-summary-item">
            <span class="pm-summary-label">Total Payouts</span>
            <span class="pm-summary-value tw-text-success">₱{{ totalAmount | number:'1.2-2' }}</span>
          </div>
          <div class="pm-summary-divider"></div>
          <div class="pm-summary-item">
            <span class="pm-summary-label">Processing Fees</span>
            <span class="pm-summary-value tw-text-[#0891b2]">₱{{ totalProcessingFees | number:'1.2-2' }}</span>
          </div>
        </div>

        <app-paginated-table
          title=""
          [data]="payments"
          [pagination]="pagination"
          [loading]="loading"
          [columns]="columns"
          [headerActions]="headerActions"
          [showSortableHeaders]="true"
          [sortInfo]="sortInfo"
          [actions]="rowActions"
          [responsiveMode]="'financial'"
          [showSearch]="false"
          (pageChange)="loadPayments($event)"
          (sortChange)="onSortChange($event)">
        </app-paginated-table>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary btn-sm" (click)="onClose()">Close</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show" *ngIf="show"></div>
