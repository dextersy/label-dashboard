<div class="table-responsive">
  <table class="table table-financial">
    <thead *ngIf="showHeader">
      <tr>
        <th class="mobile-narrow">Date</th>
        <th class="mobile-text">Release</th>
        <th class="tablet-hide">Description</th>
        <th class="mobile-narrow mobile-number" style="text-align:right">Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let royalty of royalties">
        <td class="mobile-narrow" data-label="Date">{{ formatDate(royalty.date_recorded) }}</td>
        <td class="mobile-text" data-label="Release">
          <span style="display:inline-flex;align-items:center;gap:8px">
            <img [src]="royalty.cover_art || coverArtPlaceholder" alt="" style="width:28px;height:28px;object-fit:cover;border-radius:3px;flex-shrink:0">
            <span>
              {{ royalty.release_title || '(None)' }}
              <span *ngIf="royalty.product_name" class="tw-block tw-text-xs tw-text-gray-400">
                {{ royalty.product_sku ? royalty.product_sku + ' · ' : '' }}{{ royalty.product_name }}
              </span>
            </span>
          </span>
        </td>
        <td class="tablet-hide" data-label="Description">{{ royalty.description }}</td>
        <td class="mobile-narrow mobile-number" style="text-align:right" data-label="Amount" [ngClass]="getAmountClass(royalty.amount)">{{ formatCurrency(royalty.amount) }}</td>
      </tr>
      <tr *ngIf="royalties.length === 0">
        <td [attr.colspan]="showHeader ? 4 : 1" class="tw-text-center">No recorded royalties yet.</td>
      </tr>
    </tbody>
  </table>
</div>
