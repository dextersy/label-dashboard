<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="https://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <!--[if !mso]><!-- -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--<![endif]-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>%HEADLINE%</title>
    <style>
        html, body { margin: 0 !important; padding: 0 !important; min-height: 100% !important; width: 100% !important; -webkit-font-smoothing: antialiased; }
        * { -ms-text-size-adjust: 100%; }
        #outlook a { padding: 0; }
        table, td, th { mso-table-lspace: 0 !important; mso-table-rspace: 0 !important; border-collapse: collapse; }
        img { border: 0; outline: 0; line-height: 100%; text-decoration: none; -ms-interpolation-mode: bicubic; }
        a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
        .pc-gmail-fix { display: none; display: none !important; }
        @media (max-width: 620px) {
            .pc-project-container { width: 100% !important; }
            .content-cell { padding: 32px 24px !important; }
            .header-cell { padding: 24px !important; }
            .footer-cell { padding: 20px 24px !important; }
            .btn-cta { padding: 14px 28px !important; font-size: 15px !important; }
            .headline { font-size: 24px !important; line-height: 32px !important; }
        }
    </style>
    <!--[if mso]>
    <style type="text/css">.pc-font-alt { font-family: Arial, Helvetica, sans-serif !important; }</style>
    <![endif]-->
</head>

<body class="pc-font-alt"
    style="width: 100% !important; min-height: 100% !important; margin: 0 !important; padding: 0 !important; background-color: #111111; mso-line-height-rule: exactly; -webkit-font-smoothing: antialiased;"
    bgcolor="#111111">

    <table width="100%" border="0" cellspacing="0" cellpadding="0" role="presentation" style="background-color: #111111;" bgcolor="#111111">
        <tr>
            <td align="center" valign="top" style="padding: 32px 16px;">

                <table class="pc-project-container" align="center" width="600"
                    style="width: 600px; max-width: 600px;" border="0" cellpadding="0" cellspacing="0" role="presentation">

                    <!-- Header -->
                    <tr>
                        <td class="header-cell" align="center" valign="middle"
                            style="background-color: #000000; padding: 28px 40px; border-radius: 12px 12px 0 0; border-bottom: 1px solid #facc15;">
                            <img src="%LOGO_URL%" width="240" height="60" alt="%PLATFORM_NAME%"
                                style="display: block; border: 0; outline: 0; margin: 0 auto;" />
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td class="content-cell" valign="top"
                            style="background-color: #1a1a1a; padding: 48px 48px 40px 48px; border-left: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a;">

                            <!-- Headline -->
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                                <tr>
                                    <td align="center" style="padding-bottom: 20px;">
                                        <div class="headline"
                                            style="font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 800; line-height: 36px; letter-spacing: -0.5px; color: #ffffff; text-align: center;">
                                            %HEADLINE%
                                        </div>
                                    </td>
                                </tr>
                            </table>

                            <!-- Greeting + body -->
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                                <tr>
                                    <td align="center" style="padding-bottom: 8px;">
                                        <div style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; line-height: 26px; color: #ffffff; text-align: center;">
                                            Hey %FIRST_NAME%,
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-bottom: 36px;">
                                        <div style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 400; line-height: 26px; color: #aaaaaa; text-align: center;">
                                            %BODY_TEXT%
                                        </div>
                                    </td>
                                </tr>
                            </table>

                            <!-- CTA button -->
                            <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation">
                                <tr>
                                    <td align="center">
                                        <!--[if mso]>
                                        <table border="0" cellpadding="0" cellspacing="0" role="presentation" align="center">
                                            <tr>
                                                <td valign="middle" align="center" style="border-radius: 8px; background-color: #facc15; padding: 14px 36px;" bgcolor="#facc15">
                                                    <a class="pc-font-alt" style="display: inline-block; text-decoration: none; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #000000;" href="%CONNECTIONS_URL%" target="_blank">%CTA_LABEL%</a>
                                                </td>
                                            </tr>
                                        </table>
                                        <![endif]-->
                                        <!--[if !mso]><!-- -->
                                        <a class="btn-cta" href="%CONNECTIONS_URL%" target="_blank"
                                            style="display: inline-block; border-radius: 8px; background-color: #facc15; padding: 14px 36px; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #000000; text-decoration: none; -webkit-text-size-adjust: none;">
                                            %CTA_LABEL%
                                        </a>
                                        <!--<![endif]-->
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="footer-cell" align="center" valign="top"
                            style="background-color: #000000; padding: 24px 40px; border-radius: 0 0 12px 12px; border-top: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a;">
                            <div style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #555555; text-align: center; line-height: 18px;">
                                You're receiving this because you have connection notifications enabled.
                                <br />
                                <a href="%NOTIFICATIONS_URL%" style="color: #888888; text-decoration: underline;">Manage email preferences</a>
                            </div>
                            <div style="padding-top: 8px;">
                                <div style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #444444; text-align: center; letter-spacing: 1px; text-transform: uppercase;">
                                    &copy; %PLATFORM_NAME%
                                </div>
                            </div>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

    <div class="pc-gmail-fix" style="white-space: nowrap; font: 15px courier; line-height: 0;">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</div>
</body>

</html>
